<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WinZoneTrigger</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#"><span class="brand-mark">W<span>↗</span></span><span>WinZone<span class="brand-light">Trigger</span><small>나의 공간, 나의 자동화</small></span></a>
      <div class="side-heading"><h2>내 위치</h2><button id="new-zone" class="icon-button" aria-label="새 위치 추가" title="새 위치 추가">＋</button></div>
      <nav id="zones" aria-label="등록된 위치"></nav>
      <div class="side-bottom"><div class="local-note"><span class="dot"></span> 이 PC에서만 안전하게 보관</div><button id="settings" class="side-link" aria-label="앱 설정" title="앱 설정">⚙ <span>앱 설정</span></button><button id="logs" class="side-link" aria-label="활동 기록" title="활동 기록">≡ <span>활동 기록</span></button><small class="version">WinZoneTrigger 1.0.66 · Tauri</small></div>
    </aside>
    <main>
      <header class="topbar"><div class="breadcrumb">내 공간 <span>/</span> <strong id="breadcrumb">불러오는 중</strong></div><div class="top-actions"><span id="engine-status" class="status-pill">상태 확인 중</span><button id="refresh" class="button subtle">↻ 새로고침</button></div></header>
      <div class="workspace" id="workspace" tabindex="-1">
        <div class="page-heading"><div><p class="eyebrow">SPACE AUTOMATION</p><h1 id="title">공간에 맞춰, 자연스럽게.</h1><p id="subtitle" class="muted">위치와 연결 상태를 불러오고 있습니다.</p></div><div id="zone-actions" class="heading-actions"></div></div>
        <section id="availability" class="availability" aria-label="현재 위치 상태" aria-live="polite"></section>
        <div id="quick-controls" class="quick-controls"></div>
        <div id="decision" class="decision" role="status"></div>
        <section id="connection" class="connection" aria-label="Wi-Fi 연결 상태"></section>
        <nav id="tabs" class="tabs" aria-label="위치 설정"></nav>
        <div id="content"></div>
      </div>
      <footer class="savebar"><div><span id="dirty-dot" class="dot neutral"></span><span id="save-status">설정을 불러오는 중</span></div><div><button id="reload" class="button subtle">다시 불러오기</button><button id="save" class="button primary">변경사항 저장 <span>↗</span></button></div></footer>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm"><form method="dialog"><h2 id="confirm-title">확인</h2><p id="confirm-message"></p><div class="dialog-actions"><button value="cancel" class="button">취소</button><button value="ok" class="button primary">확인</button></div></form></dialog>
  <dialog id="app-picker"><div class="dialog-header"><h2>앱 찾기</h2><button id="close-picker" class="icon-button" aria-label="닫기">×</button></div><input id="app-query" placeholder="앱 이름 검색" aria-label="앱 이름 검색"><div id="app-results"></div></dialog>
  <script type="module" src="app.js"></script>
</body></html>
