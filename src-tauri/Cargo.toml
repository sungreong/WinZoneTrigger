[package]
name = "win-zone-trigger"
version = "1.0.64"
edition = "2021"

[[bin]]
name = "WinZoneTrigger"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tempfile = "3"
